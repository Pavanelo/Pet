<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="application-name" content="PetPet">

  <title>PetPet | Agendamentos</title>

  <link rel="stylesheet" href="../css/site.css">
  <link rel="stylesheet" href="../css/saude.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >
</head>

<body class="health-page">

  <header class="petpet-header">
    <a class="petpet-logo" href="inicio.html">
      <img src="../assets/img/Frame 13.png" alt="PetHealth">
    </a>

    <nav class="petpet-nav">
      <a href="sobre.html">Sobre</a>
      <a href="agendamentos.html">Serviços</a>
      <a href="cadastro-pet.html">Dicas</a>
      <a href="loja.html">Loja</a>

      <a class="petpet-account" href="conta.html">
        <span class="petpet-account-dot"></span>
        <span id="nomeContaNav">Minha conta</span>
      </a>

      <button id="sair" type="button">Sair</button>
    </nav>
  </header>

  <a class="back-button" href="conta.html">← Voltar</a>

  <main class="health-shell">

    <div class="health-title">
      <div>
        <span class="eyebrow">ROTINA DO PET</span>
        <h1>Agendamentos</h1>
        <p>Organize consultas, vacinas, banho e outros cuidados.</p>
      </div>

      <div class="health-title-actions">
        <a class="secondary" href="historico.html">🩺 Histórico</a>
        <button class="primary" id="novoAgendamento">
          + Novo agendamento
        </button>
      </div>
    </div>

    <div class="calendar-layout">

      <section class="calendar-card">
        <div class="calendar-head">
          <button id="mesAnterior" type="button">‹</button>
          <h2 id="mesTitulo">Calendário</h2>
          <button id="mesProximo" type="button">›</button>
        </div>

        <div class="weekdays">
          <span>Dom</span>
          <span>Seg</span>
          <span>Ter</span>
          <span>Qua</span>
          <span>Qui</span>
          <span>Sex</span>
          <span>Sáb</span>
        </div>

        <div class="calendar-grid" id="calendarGrid"></div>

        <div class="legend">
          <span><i class="dot consulta"></i>Consulta</span>
          <span><i class="dot vacina"></i>Vacina</span>
          <span><i class="dot outros"></i>Outros</span>
        </div>
      </section>

      <section>
        <div class="section-heading">
          <h2>Próximos agendamentos</h2>
          <span id="petAgendaNome"></span>
        </div>

        <div id="listaAgendamentos" class="agenda-list">
          <div class="empty">Carregando...</div>
        </div>
      </section>

    </div>
  </main>

  <div class="modal" id="modalAgendamento" aria-hidden="true">
    <div class="modal-card">
      <button class="close" id="fecharModal" type="button">×</button>

      <h2>Novo agendamento</h2>

      <form id="formAgendamento">

        <label>
          Pet
          <select id="petAgenda" name="pet_id" required></select>
        </label>

        <label>
          Título
          <input
            name="titulo"
            required
            placeholder="Ex.: Consulta de rotina"
          >
        </label>

        <label>
          Tipo
          <select name="tipo">
            <option>Consulta</option>
            <option>Vacina</option>
            <option>Banho e tosa</option>
            <option>Exame</option>
            <option>Outro</option>
          </select>
        </label>

        <label>
          Data e hora
          <input name="data_hora" type="datetime-local" required>
        </label>

        <label>
          Local
          <input
